<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  window.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "streamlit:render") return;
    var a = e.data.args || {};
    var secure = location.protocol === "https:" ? "; Secure" : "";
    if (a.action === "set" && a.name && a.value) {
      document.cookie = a.name + "=" + encodeURIComponent(a.value) + "; Path=/; Max-Age=" +
        Math.round((a.days || 14) * 86400) + "; SameSite=Lax" + secure;
    } else if (a.action === "clear" && a.name) {
      document.cookie = a.name + "=; Path=/; Max-Age=0; SameSite=Lax" + secure;
    }
  });
  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 0 });
</script>
</body></html>
