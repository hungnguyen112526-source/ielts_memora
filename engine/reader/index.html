<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orange Reader</title>
  <!-- Tailwind đã build sẵn (xem tools/tailwind/build.sh) -->
  <link rel="stylesheet" href="tailwind.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    /* Tùy chỉnh thanh cuộn gọn gàng và hiệu ứng highlight văn bản */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    mark.user-hl { color: #1e293b; padding: 0 1px; border-radius: 3px; cursor: pointer; }
    mark.hl-yellow { background-color: #fef08a; }
    mark.hl-orange { background-color: #fdba74; }
    mark.hl-red    { background-color: #fca5a5; }
    .dark mark.user-hl { color: #ffffff; }
    .dark mark.hl-yellow { background-color: #a16207; }
    .dark mark.hl-orange { background-color: #c2410c; }
    .dark mark.hl-red    { background-color: #b91c1c; }
    .hl-dot { width: 20px; height: 20px; border-radius: 9999px; border: 2px solid rgba(255,255,255,.75); transition: transform .12s; }
    .hl-dot:hover { transform: scale(1.18); }
    /* Chia đôi màn hình: khung bài đọc kéo được, mặc định hẹp hơn khung câu hỏi */
    @media (min-width: 768px) {
      #passagePane { flex: 0 0 var(--split, 42%); width: var(--split, 42%); }
      #questionsPane { flex: 1 1 0%; width: auto; }
      #splitter { width: 10px; cursor: col-resize; touch-action: none; }
    }
    .inline-input {
      border-bottom: 2px solid #94a3b8;
      background: transparent;
      padding: 2px 6px;
      min-width: 110px;
      max-width: 180px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .inline-input:focus {
      outline: none;
      border-bottom-color: #2563eb;
      background-color: rgba(37, 99, 235, 0.06);
    }
    .dark .inline-input:focus {
      background-color: rgba(59, 130, 246, 0.15);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased h-screen flex flex-col overflow-hidden">

  <!-- ==================== HEADER ==================== -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-3 sm:px-5 py-2.5 flex items-center justify-between gap-2 shrink-0 z-20 shadow-sm">
    <!-- Logo & Test Selector -->
    <div class="flex items-center gap-2 sm:gap-3 min-w-0">
      <button id="btnHome" onclick="exitToLibrary()" title="Về danh sách đề" class="flex items-center gap-2 text-left group shrink-0">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-extrabold text-sm shadow-sm group-hover:bg-blue-700 transition">
          <span id="logoBadge">O</span>
        </div>
        <div class="hidden md:block">
          <h1 class="text-sm font-bold leading-tight text-slate-900 dark:text-white"><span id="hdrTitle">Orange</span></h1>
          <p class="text-[11px] text-slate-500 dark:text-slate-400"><span id="hdrSub">Reading</span></p>
        </div>
      </button>

      <button onclick="exitToLibrary()" class="hidden sm:inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M15 19l-7-7 7-7"/></svg>
        Danh sách đề
      </button>

      <!-- Test Switcher (visible in test view) -->
      <div id="headerTestControls" class="hidden flex items-center gap-1.5 sm:gap-2 ml-1 sm:ml-2 pl-2 sm:pl-3 border-l border-slate-200 dark:border-slate-700">
        <button id="btnPrevTest" onclick="goNeighbour('prev')" title="Đề trước" aria-label="Đề trước" class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition disabled:opacity-35 disabled:cursor-not-allowed disabled:hover:bg-transparent">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <span id="testTitleBadge" class="text-xs sm:text-sm font-semibold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"></span>
        <button id="btnNextTest" onclick="goNeighbour('next')" title="Đề sau" aria-label="Đề sau" class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition disabled:opacity-35 disabled:cursor-not-allowed disabled:hover:bg-transparent">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 5l7 7-7 7"/></svg>
        </button>
        <span id="answeredBadge" class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-blue-50 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300">
          0 đã làm
        </span>
      </div>
    </div>

    <!-- Center: Timer (visible in test view) -->
    <div id="timerBar" class="hidden flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
      <svg class="w-4 h-4 text-blue-600 dark:text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span id="timerDisplay" class="font-mono font-bold text-sm sm:text-base tracking-tight">60:00</span>
      <span id="timerScope" class="hidden text-[11px] font-bold px-1.5 py-0.5 rounded-md bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300"></span>
      <button id="btnToggleTimer" onclick="toggleTimer()" title="Tạm dừng / Tiếp tục" class="ml-1 p-1 rounded-md hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition">
        <svg id="iconPause" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        <svg id="iconPlay" class="w-3.5 h-3.5 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
      </button>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-1.5 sm:gap-2">
      <!-- Font Size & Theme -->
      <div id="fontControls" class="hidden lg:flex items-center bg-slate-100 dark:bg-slate-800 rounded-lg p-0.5 border border-slate-200 dark:border-slate-700">
        <button onclick="changeFontSize(-1)" class="px-2 py-1 text-xs font-bold hover:bg-white dark:hover:bg-slate-700 rounded-md transition" title="Giảm cỡ chữ">A-</button>
        <button onclick="changeFontSize(0)" class="px-2 py-1 text-xs font-bold hover:bg-white dark:hover:bg-slate-700 rounded-md transition" title="Cỡ chữ mặc định">A</button>
        <button onclick="changeFontSize(1)" class="px-2 py-1 text-xs font-bold hover:bg-white dark:hover:bg-slate-700 rounded-md transition" title="Tăng cỡ chữ">A+</button>
      </div>

      <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition" title="Chế độ Sáng / Tối">
        <svg id="sunIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg id="moonIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>

      <!-- Action Buttons (visible in test view) -->
      <div id="testActionBtns" class="hidden flex items-center gap-1.5">
        <button id="btnResetTest" onclick="confirmReset()" class="px-2.5 sm:px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          Làm lại
        </button>
        <button id="btnSubmitTest" onclick="confirmSubmit()" class="px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition">
          Nộp bài
        </button>
        <button id="btnViewResult" onclick="openResultModal()" class="hidden px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm transition">
          Xem điểm
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== TEST WORKSPACE VIEW ==================== -->
  <section id="testView" class="hidden flex-1 flex flex-col overflow-hidden">
    <!-- Mobile View Toggle (Passage / Questions) -->
    <div class="md:hidden flex border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shrink-0">
      <button id="mobTabPassage" onclick="setMobilePane('passage')" class="flex-1 py-2.5 text-sm font-bold text-blue-600 border-b-2 border-blue-600">
        Bài đọc (Passage)
      </button>
      <button id="mobTabQuestions" onclick="setMobilePane('questions')" class="flex-1 py-2.5 text-sm font-semibold text-slate-500 dark:text-slate-400">
        Câu hỏi (Questions)
      </button>
    </div>

    <!-- Split Panes Container -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
      <!-- LEFT PANE: READING PASSAGE -->
      <div id="passagePane" class="w-full min-w-0 h-full overflow-y-auto p-4 sm:p-6 lg:p-8 bg-white dark:bg-slate-900 md:border-r border-slate-200 dark:border-slate-800">
        <div class="max-w-3xl mx-auto">
          <div class="flex items-center justify-between gap-2 mb-4 pb-3 border-b border-slate-100 dark:border-slate-800">
            <span id="passageLabel" class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300">
              READING PASSAGE 1
            </span>
            <div class="flex items-center gap-2">
              <button onclick="clearHighlights()" title="Xóa toàn bộ highlight của passage này (cả bài đọc và phần đề)" class="text-xs font-medium text-slate-500 hover:text-rose-600 dark:text-slate-400 dark:hover:text-rose-400 transition">
                Xóa highlight
              </button>
            </div>
          </div>
          <p id="passageInstruction" class="text-xs sm:text-sm italic text-slate-500 dark:text-slate-400 mb-4"></p>
          <h2 id="passageTitle" class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white mb-2 leading-snug"></h2>
          <p id="passageSubtitle" class="text-sm sm:text-base font-medium text-slate-600 dark:text-slate-300 mb-5 italic"></p>
          <article id="passageContent" class="space-y-4 leading-relaxed text-slate-700 dark:text-slate-200 select-text text-[15px]">
            <!-- Passage paragraphs rendered here -->
          </article>
          <div id="passageFootnotes" class="mt-6 pt-4 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400 space-y-1"></div>
        </div>
      </div>

      <!-- THANH KÉO CHIA KHUNG -->
      <div id="splitter" title="Kéo để đổi độ rộng (bấm đúp để về mặc định)" class="hidden md:block shrink-0 bg-slate-200 dark:bg-slate-700 hover:bg-blue-400 dark:hover:bg-blue-500 transition-colors"></div>

      <!-- RIGHT PANE: QUESTIONS -->
      <div id="questionsPane" class="hidden md:block w-full min-w-0 h-full overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-50 dark:bg-slate-950">
        <div id="questionsContainer" class="w-full mx-auto space-y-6 pb-10 select-text">
          <!-- Question groups rendered here -->
        </div>
      </div>
    </div>

    <!-- Floating Highlight Tooltip -->
    <div id="hlTooltip" onmousedown="event.preventDefault()" style="display:none"
         class="fixed z-50 bg-slate-900 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl shadow-lg items-center gap-2 transform -translate-x-1/2">
      <span class="text-slate-300">Highlight</span>
      <button type="button" onclick="applyHighlight('yellow')" title="Vàng" aria-label="Highlight vàng" class="hl-dot" style="background:#facc15"></button>
      <button type="button" onclick="applyHighlight('orange')" title="Cam" aria-label="Highlight cam" class="hl-dot" style="background:#fb923c"></button>
      <button type="button" onclick="applyHighlight('red')" title="Đỏ" aria-label="Highlight đỏ" class="hl-dot" style="background:#ef4444"></button>
    </div>

    <!-- ==================== FOOTER NAVIGATOR ==================== -->
    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-3 sm:px-5 py-2 shrink-0 z-20">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-2">
        <div id="passageTabs" class="flex items-center gap-1.5 shrink-0"></div>

        <!-- 40 Question Pills -->
        <div id="questionNavPills" class="flex flex-wrap items-center gap-1 lg:justify-end">
          <!-- Rendered by JS -->
        </div>
      </div>
    </footer>
  </section>

  <!-- ==================== CUSTOM MODAL (CONFIRM & RESULT) ==================== -->
  <div id="modalOverlay" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div id="modalBox" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 max-w-lg w-full p-6 shadow-2xl transform transition-all">
      <!-- Dynamic Modal Content -->
    </div>
  </div>

  <!-- ==================== APPLICATION SCRIPT & FULL DATA ==================== -->
  <script>
    /* =========================================================================
       1. DỮ LIỆU ĐẦY ĐỦ 4 ĐỀ READING - CAMBRIDGE IELTS 21 (ACADEMIC)
       ========================================================================= */

    /* =========================================================================
       DỮ LIỆU & TRẠNG THÁI (nhận từ Streamlit, mỗi lần chỉ 1 đề)
       ========================================================================= */
    let TESTS = [];
    let TEST = null;
    let QTOTAL = 40;          // số câu trong phạm vi đang làm
    let QLO = 1, QHI = 40;    // dải số câu của phạm vi
    let SCOPE = 'full';       // 'full' (cả đề) hoặc 'p1'..'pN' (làm lẻ một passage)
    let PIDX = null;          // chỉ số passage khi làm lẻ, null khi làm cả đề
    let SESSION_KEY = null;

    let appState = {
      darkMode: false,
      fontSize: 15,
      split: 42,
      tests: { 0: { answers: {}, submitted: false, score: null, configured: false, limit: 3600,
                    spent: 0, passage: 0, hl: {} } }
    };

    let currentTestIdx = null;
    let currentPassageIdx = 0;
    let timerInterval = null;
    let timerPaused = false;
    let pendingSelectionRange = null;
    let tBase = 0, tStart = 0;   // đồng hồ theo mốc thời gian thật, không bị chậm khi tab nền

    function setScope(scope) {
      const m = /^p(\d+)$/.exec(scope || '');
      const n = TEST.passages.length;
      PIDX = (m && +m[1] >= 1 && +m[1] <= n) ? +m[1] - 1 : null;
      SCOPE = PIDX === null ? 'full' : 'p' + (PIDX + 1);
      if (PIDX === null) { QLO = 1; QHI = TEST.totalQuestions; }
      else { QLO = TEST.passages[PIDX].qRange[0]; QHI = TEST.passages[PIDX].qRange[1]; }
      QTOTAL = QHI - QLO + 1;
    }
    function scopePassages() { return PIDX === null ? TEST.passages.map((_, i) => i) : [PIDX]; }
    function durationSec() {
      if (!TEST) return 3600;
      return PIDX === null ? TEST.durationMin * 60 : Math.round(TEST.durationMin / TEST.passages.length) * 60;
    }
    function freshState() {
      return { answers: {}, submitted: false, score: null, configured: false, limit: durationSec(),
               spent: 0, passage: PIDX === null ? 0 : PIDX, hl: {} };
    }

    // Đọc trạng thái đã lưu (chịu được bản cũ: chỉ có timeLeft, hoặc chế độ passage cũ có pspent)
    function loadSaved(saved) {
      const base = freshState();
      if (!saved || (saved.answers === undefined && saved.timeLeft === undefined && saved.configured === undefined)) return base;
      const num = (v, d) => (typeof v === 'number' && isFinite(v) && v >= 0 ? Math.floor(v) : d);
      const lim = durationSec();
      if (saved.limit === undefined && typeof saved.timeLeft === 'number') {
        return Object.assign(base, { answers: saved.answers || {}, submitted: !!saved.submitted,
          score: saved.score == null ? null : saved.score, configured: true, limit: lim,
          spent: Math.max(0, lim - Math.floor(saved.timeLeft)) });
      }
      let spent = num(saved.spent, 0);
      if (saved.pspent) spent = Object.values(saved.pspent).reduce((s, v) => s + (num(v, 0)), 0);
      return Object.assign(base, {
        answers: saved.answers || {}, submitted: !!saved.submitted, score: saved.score == null ? null : saved.score,
        configured: saved.configured === undefined ? true : !!saved.configured,
        limit: num(saved.limit, lim), spent: spent,
        passage: PIDX === null ? num(saved.passage, 0) : PIDX, hl: saved.hl || {}
      });
    }

    function isLocked() { return !!appState.tests[0].submitted; }
    function getSpent(st) { return st.spent || 0; }
    function hasAns(v) { return v !== undefined && v !== null && String(v).trim() !== ''; }

    /* ---- Giao tiếp với Streamlit (giao thức custom component) ---- */
    function sendMsg(type, data) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), '*');
    }
    function setFrameHeight(h) { sendMsg('streamlit:setFrameHeight', { height: h }); }

    let dirty = false;
    let lastSent = 0;

    function snapshot() {
      const st = appState.tests[0];
      return { answers: st.answers, submitted: st.submitted, score: st.score, configured: st.configured,
               limit: st.limit, spent: st.spent, passage: currentPassageIdx, hl: st.hl };
    }

    function pushState(event, result) {
      if (!TEST) return;
      const payload = {
        nonce: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        event: event,
        sessionKey: SESSION_KEY,
        testId: TEST.id,
        scope: SCOPE,
        state: snapshot(),
        prefs: { darkMode: appState.darkMode, fontSize: appState.fontSize, split: appState.split }
      };
      if (result) payload.result = result;
      sendMsg('streamlit:setComponentValue', { value: payload, dataType: 'json' });
      dirty = false;
      lastSent = Date.now();
    }

    // Mọi thay đổi chỉ đánh dấu "bẩn"; tự gửi lên server tối đa mỗi ~8 giây. Đồng hồ không đánh dấu bẩn.
    function saveState() { dirty = true; }
    setInterval(() => { if (dirty && TEST && Date.now() - lastSent > 8000) pushState('autosave'); }, 3000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && dirty && TEST) pushState('autosave');
      else if (!document.hidden) tick();            // quay lại tab: cập nhật đồng hồ ngay
    });
    window.addEventListener('pagehide', () => { if (dirty && TEST) pushState('autosave'); });

    function exitToLibrary() {
      stopTimer();
      // Chưa bấm "Bắt đầu" thì không lưu gì cả
      pushState(appState.tests[0].configured || appState.tests[0].submitted ? 'exit' : 'cancel');
    }

    // Chuyển sang đề trước / đề sau trong cùng bộ (Python lưu tiến độ rồi mở đề mới)
    let NAV = { prev: false, next: false };
    function applyNav() {
      const p = document.getElementById('btnPrevTest');
      const n = document.getElementById('btnNextTest');
      if (p) p.disabled = !NAV.prev;
      if (n) n.disabled = !NAV.next;
    }
    function goNeighbour(which) {
      if (!NAV[which]) return;
      stopTimer();
      pushState(which);
    }

    /* =========================================================================
       3. CHẾ ĐỘ SÁNG/TỐI & CỠ CHỮ
       ========================================================================= */
    function applyTheme() {
      const html = document.documentElement;
      const sun = document.getElementById('sunIcon');
      const moon = document.getElementById('moonIcon');
      if (appState.darkMode) {
        html.classList.add('dark');
        sun.classList.remove('hidden');
        moon.classList.add('hidden');
      } else {
        html.classList.remove('dark');
        sun.classList.add('hidden');
        moon.classList.remove('hidden');
      }
    }

    function toggleDarkMode() {
      appState.darkMode = !appState.darkMode;
      applyTheme();
      saveState();
    }

    function changeFontSize(delta) {
      if (delta === 0) appState.fontSize = 15;
      else appState.fontSize = Math.min(22, Math.max(13, appState.fontSize + delta * 1.5));
      const article = document.getElementById('passageContent');
      if (article) article.style.fontSize = appState.fontSize + 'px';
      saveState();
    }

    /* =========================================================================
       4. QUY ĐỔI ĐIỂM IELTS ACADEMIC READING
       ========================================================================= */
    const DEFAULT_BANDS = [[39,"9.0"],[37,"8.5"],[35,"8.0"],[33,"7.5"],[30,"7.0"],[27,"6.5"],[23,"6.0"],[19,"5.5"],[15,"5.0"],[13,"4.5"],[10,"4.0"],[8,"3.5"],[6,"3.0"],[4,"2.5"]];
    function getBandScore(correct) {
      const table = (TEST && Array.isArray(TEST.bandTable)) ? TEST.bandTable : DEFAULT_BANDS;
      for (const [min, band] of table) if (correct >= min) return band;
      return "2.0";
    }

    /* =========================================================================
       5. MỞ ĐỀ & ĐIỀU HƯỚNG PASSAGE
       ========================================================================= */
    function countAnswered(testIdx) {
      const ans = appState.tests[testIdx].answers;
      let count = 0;
      for (let i = QLO; i <= QHI; i++) if (hasAns(ans[i])) count++;
      return count;
    }

    function openTest(testIdx) {
      stopTimer();
      currentTestIdx = testIdx;
      const stOpen = appState.tests[testIdx];
      currentPassageIdx = PIDX !== null ? PIDX : Math.min(Math.max(0, stOpen.passage || 0), TEST.passages.length - 1);
      applySplit();
      document.getElementById('testView').classList.remove('hidden');
      document.getElementById('headerTestControls').classList.remove('hidden');
      document.getElementById('timerBar').classList.remove('hidden');
      document.getElementById('testActionBtns').classList.remove('hidden');
      document.getElementById('fontControls').classList.remove('hidden');
      document.getElementById('testTitleBadge').textContent = TESTS[testIdx].title + (PIDX !== null ? ' · Passage ' + (PIDX + 1) : '');
      updateHeaderActionButtons();
      renderPassage();
      renderFooterNav();
      if (!stOpen.configured && !stOpen.submitted) openSetup(); else startTimer();
    }

    function switchPassage(pIdx) {
      if (PIDX !== null && pIdx !== PIDX) return;       // làm lẻ: chỉ có một passage
      currentPassageIdx = pIdx;
      appState.tests[currentTestIdx].passage = pIdx;
      saveState();
      hideTip();
      renderPassage();
      renderFooterNav();
      document.getElementById('passagePane').scrollTop = 0;
      document.getElementById('questionsPane').scrollTop = 0;
      updateHeaderActionButtons();
    }

    function setMobilePane(pane) {
      const pPane = document.getElementById('passagePane');
      const qPane = document.getElementById('questionsPane');
      const tP = document.getElementById('mobTabPassage');
      const tQ = document.getElementById('mobTabQuestions');
      if (pane === 'passage') {
        pPane.classList.remove('hidden');
        qPane.classList.add('hidden');
        tP.className = "flex-1 py-2.5 text-sm font-bold text-blue-600 border-b-2 border-blue-600";
        tQ.className = "flex-1 py-2.5 text-sm font-semibold text-slate-500 dark:text-slate-400";
      } else {
        pPane.classList.add('hidden');
        qPane.classList.remove('hidden');
        tQ.className = "flex-1 py-2.5 text-sm font-bold text-blue-600 border-b-2 border-blue-600";
        tP.className = "flex-1 py-2.5 text-sm font-semibold text-slate-500 dark:text-slate-400";
      }
    }

    function updateHeaderActionButtons() {
      const st = appState.tests[currentTestIdx];
      document.getElementById('answeredBadge').textContent = `${countAnswered(currentTestIdx)}/${QTOTAL} đã làm`;
      const sub = document.getElementById('btnSubmitTest');
      const view = document.getElementById('btnViewResult');
      if (st.submitted) {
        sub.classList.add('hidden');
        view.classList.remove('hidden');
        return;
      }
      view.classList.add('hidden');
      sub.textContent = PIDX === null ? 'Nộp bài' : 'Nộp Passage ' + (PIDX + 1);
      sub.classList.remove('hidden');
    }

    /* =========================================================================
       7. ĐỒNG HỒ ĐẾM NGƯỢC
       ========================================================================= */
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function startTimer() {
      stopTimer();
      timerPaused = false;
      const st = appState.tests[currentTestIdx];
      updateTimerUI();
      if (st.submitted || !st.configured) return;
      tBase = st.spent || 0;
      tStart = Date.now();
      timerInterval = setInterval(tick, 500);
    }

    // Tính theo mốc Date.now(): tab chạy nền bị trình duyệt làm chậm timer cũng không làm lệch thời gian.
    function tick() {
      if (timerPaused || currentTestIdx === null || !timerInterval) return;
      const st = appState.tests[currentTestIdx];
      if (st.submitted || !st.configured) return;
      let spent = tBase + Math.floor((Date.now() - tStart) / 1000);
      if (st.limit > 0) spent = Math.min(spent, st.limit);
      if (spent !== st.spent) { st.spent = spent; updateTimerUI(); }
      if (st.limit > 0 && spent >= st.limit) onTimeUp();
    }

    function onTimeUp() { submitTest(true); }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function toggleTimer() {
      if (currentTestIdx === null || isLocked()) return;
      const st = appState.tests[currentTestIdx];
      if (!st.configured) return;
      if (!timerPaused) {
        tick();
        timerPaused = true;
      } else {
        tBase = st.spent || 0;
        tStart = Date.now();
        timerPaused = false;
      }
      updateTimerUI();
    }

    function updateTimerUI() {
      const st = appState.tests[currentTestIdx];
      if (!st) return;
      const disp = document.getElementById('timerDisplay');
      const scope = document.getElementById('timerScope');
      const spent = getSpent(st);
      const limit = st.limit || 0;
      const locked = isLocked();
      let warn = false;
      if (limit > 0) {
        const left = Math.max(0, limit - spent);
        disp.textContent = formatTime(left);
        warn = !locked && left <= (limit >= 600 ? 300 : 60);
      } else {
        disp.textContent = formatTime(spent);        // không giới hạn: đếm lên
      }
      disp.classList.toggle('text-rose-600', warn);
      disp.classList.toggle('dark:text-rose-400', warn);
      const label = (PIDX !== null ? 'P' + (PIDX + 1) : '') + (limit === 0 ? (PIDX !== null ? ' ' : '') + '∞' : '');
      scope.textContent = label;
      scope.classList.toggle('hidden', !label);
      document.getElementById('iconPause').classList.toggle('hidden', timerPaused);
      document.getElementById('iconPlay').classList.toggle('hidden', !timerPaused);
    }

    /* =========================================================================
       7b. THIẾT LẬP BÀI LÀM (thời gian; phạm vi do thư viện đề chọn)
       ========================================================================= */
    let setup = null;

    function setupDefault() { return Math.round(durationSec() / 60); }
    function setupPresets() {
      const base = PIDX === null ? [20, 40, 60] : [10, 15, 20, 25];
      const def = setupDefault();
      if (!base.includes(def)) base.push(def);
      return base.sort((a, b) => a - b);
    }

    function openSetup() {
      setup = { choice: String(setupDefault()), custom: '30' };
      renderSetup();
    }
    function setSetupChoice(c) { setup.choice = c; renderSetup(); }

    function renderSetup() {
      const chip = (val, label) => `<button type="button" onclick="setSetupChoice('${val}')" class="px-3.5 py-1.5 rounded-xl text-sm font-bold border transition ${
        setup.choice === val ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800'}">${label}</button>`;
      const presets = setupPresets();
      const scopeText = PIDX === null ? `Cả đề · ${TEST.passages.length} passage · ${QTOTAL} câu` : `Passage ${PIDX + 1} · ${QTOTAL} câu`;
      openModal(`
        <div>
          <h3 class="text-lg font-extrabold text-slate-900 dark:text-white mb-1">Thiết lập bài làm</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 mb-1">${TEST.title}</p>
          <p class="inline-block text-xs font-bold px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 mb-5">${scopeText}</p>

          <div class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">${PIDX === null ? 'Thời gian cho cả đề' : 'Thời gian cho passage này'}</div>
          <div class="flex flex-wrap items-center gap-2 mb-2">
            ${presets.map(m => chip(String(m), m + ' phút')).join('')}
            ${chip('custom', 'Tùy chọn')}
            ${chip('inf', 'Không giới hạn')}
          </div>
          ${setup.choice === 'custom' ? `
            <div class="flex items-center gap-2 mt-2">
              <input id="customMin" type="number" min="1" max="180" value="${setup.custom}" oninput="setup.custom = this.value"
                class="w-24 px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
              <span class="text-sm text-slate-600 dark:text-slate-300">phút (1–180)</span>
            </div>` : ''}
          ${setup.choice === 'inf' ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-2">Đồng hồ sẽ đếm lên để bạn biết mình đã làm bao lâu, không tự nộp bài.</p>` : ''}

          <div class="flex items-center justify-end gap-3 mt-6">
            <button onclick="exitToLibrary()" class="px-4 py-2 rounded-xl text-sm font-semibold border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Về danh sách đề</button>
            <button onclick="startFromSetup()" class="px-5 py-2 rounded-xl text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition">Bắt đầu làm bài</button>
          </div>
        </div>
      `);
    }

    function startFromSetup() {
      let limit;
      if (setup.choice === 'inf') limit = 0;
      else if (setup.choice === 'custom') {
        const m = parseInt(setup.custom, 10);
        if (!(m >= 1 && m <= 180)) { showToast('Nhập số phút từ 1 đến 180.'); return; }
        limit = m * 60;
      } else limit = parseInt(setup.choice, 10) * 60;
      const st = appState.tests[currentTestIdx];
      st.configured = true; st.limit = limit; st.spent = 0;
      closeModal();
      updateHeaderActionButtons();
      renderPassage();
      renderFooterNav();
      startTimer();
      pushState('autosave');
    }

    /* =========================================================================
       8. RENDER BÀI ĐỌC & CÂU HỎI
       ========================================================================= */
    function renderPassage() {
      const test = TESTS[currentTestIdx];
      const passage = test.passages[currentPassageIdx];

      document.getElementById('passageLabel').textContent = passage.label;
      document.getElementById('passageInstruction').textContent = passage.instruction;
      document.getElementById('passageTitle').textContent = passage.title;

      const subEl = document.getElementById('passageSubtitle');
      if (passage.subtitle) {
        subEl.textContent = passage.subtitle;
        subEl.classList.remove('hidden');
      } else {
        subEl.classList.add('hidden');
      }

      const contentEl = document.getElementById('passageContent');
      contentEl.style.fontSize = appState.fontSize + 'px';
      contentEl.innerHTML = passage.paragraphs.map(p => `<p>${p}</p>`).join('');

      const fnEl = document.getElementById('passageFootnotes');
      if (passage.footnotes && passage.footnotes.length > 0) {
        fnEl.innerHTML = passage.footnotes.map(f => `<p>${f}</p>`).join('');
        fnEl.classList.remove('hidden');
      } else {
        fnEl.classList.add('hidden');
      }

      renderQuestions(passage);
      renderHighlights();
    }

    function renderQuestions(passage) {
      const container = document.getElementById('questionsContainer');
      const st = appState.tests[currentTestIdx];
      const isSubmitted = st.submitted;
      const locked = isLocked(currentPassageIdx);

      container.innerHTML = passage.groups.map(group => {
        let bodyHtml = '';

        if (group.type === 'notes') {
          bodyHtml = `
            <div class="bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5 space-y-4">

                <div>
                  <h5 class="font-bold text-sm text-blue-700 dark:text-blue-400 mb-2">${sec.heading}</h5>

              `).join('')}

        } else if (group.type === 'table') {
          bodyHtml = `
            <div class="overflow-x-auto border border-slate-200 dark:border-slate-700 rounded-xl">
              <div class="bg-slate-100 dark:bg-slate-800 px-4 py-2.5 font-extrabold text-sm text-center border-b border-slate-200 dark:border-slate-700">${group.boxTitle}</div>
              <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 dark:bg-slate-800/80 text-xs uppercase text-slate-600 dark:text-slate-300 border-b border-slate-200 dark:border-slate-700">

                </thead>

                    <tr class="bg-white dark:bg-slate-900">
                      ${row.map(cell => `<td class="px-3 py-3 align-top leading-relaxed">${replaceInlineInputs(cell)}</td>`).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
        } else if (group.type === 'flowchart') {
          bodyHtml = `
            <div class="space-y-2">
              <h4 class="text-center font-extrabold text-sm text-slate-900 dark:text-white mb-3">${group.boxTitle}</h4>
              ${group.steps.map((step, idx) => `
                <div class="bg-slate-50 dark:bg-slate-800/70 border border-slate-300 dark:border-slate-600 rounded-xl p-3.5 text-sm leading-relaxed text-center">
                  ${replaceInlineInputs(step)}
                </div>
                ${idx < group.steps.length - 1 ? `<div class="flex justify-center text-slate-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg></div>` : ''}
              `).join('')}
            </div>
          `;
        } else if (group.type === 'summary_text') {
          bodyHtml = `
            <div class="bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5 space-y-3 text-sm leading-relaxed">
              <h4 class="font-extrabold text-base text-slate-900 dark:text-white mb-1">${group.boxTitle}</h4>
              ${group.paragraphs.map(p => `<p>${replaceInlineInputs(p)}</p>`).join('')}
            </div>
          `;
        } else if (group.type === 'summary_box') {
          bodyHtml = `
            <div class="bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5 space-y-3 text-sm leading-relaxed">
              <h4 class="font-extrabold text-base text-slate-900 dark:text-white mb-1">${group.boxTitle}</h4>

              <div class="mt-4 pt-3 border-t border-slate-200 dark:border-slate-700 grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs">
                ${group.legend.map(l => `
                  <div class="flex items-start gap-2 bg-white dark:bg-slate-900 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700">

        } else if (group.type === 'tfng') {
          bodyHtml = `<div class="space-y-3">
            ${group.items.map(item => {
              const val = st.answers[item.q] || '';
              const statusHtml = isSubmitted ? renderReviewBadge(item.q) : '';
              return `
                <div id="q-anchor-${item.q}" class="p-3.5 rounded-xl border ${getQuestionCardBorder(item.q)} bg-white dark:bg-slate-900 transition">

        } else if (group.type === 'matching') {

              ${group.legendTitle ? `<h5 class="text-xs font-extrabold uppercase tracking-wider text-blue-700 dark:text-blue-300 mb-2">${group.legendTitle}</h5>` : ''}
              <div class="space-y-1.5 text-xs sm:text-sm">

          bodyHtml = legendHtml + `<div class="space-y-2.5">
            ${group.items.map(item => {
              const val = st.answers[item.q] || '';
              return `
                <div id="q-anchor-${item.q}" class="p-3.5 rounded-xl border ${getQuestionCardBorder(item.q)} bg-white dark:bg-slate-900 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div class="flex items-start gap-2.5">
                    <span class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-extrabold flex items-center justify-center shrink-0 mt-0.5">${item.q}</span>
                    <p class="text-sm leading-snug">${item.text}</p>
                  </div>
                  <div class="flex items-center gap-2 shrink-0 pl-8 sm:pl-0">
                    <select ${locked ? 'disabled' : ''} onchange="setAnswer(${item.q}, this.value)" class="text-sm font-bold bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                      <option value="">-- Chọn --</option>
                      ${group.options.map(opt => `<option value="${opt}" ${val === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                    </select>
                    ${isSubmitted ? renderReviewBadge(item.q) : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>`;
        } else if (group.type === 'mcq') {

              const val = st.answers[item.q] || '';
              return `

                    <div class="flex items-start gap-2.5">

                  </div>
                  <div class="space-y-2 pl-8">
                    ${item.options.map(opt => {
                      const active = val === opt.k;
                      return `

          </div>`;
        } else if (group.type === 'multi2') {
          const [q1, q2] = group.qPair;
          const selected = [st.answers[q1], st.answers[q2]].filter(Boolean);
          bodyHtml = `
            <div id="q-anchor-${q1}" class="p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
              <div id="q-anchor-${q2}" class="flex items-center justify-between mb-3">
                <span class="text-xs font-bold text-blue-600 dark:text-blue-400">Đã chọn: ${selected.length}/2 đáp án (Câu ${q1} & ${q2})</span>
                ${isSubmitted ? `<div class="flex gap-1.5">${renderReviewBadge(q1)} ${renderReviewBadge(q2)}</div>` : ''}
              </div>
              <div class="space-y-2">
                ${group.options.map(opt => {
                  const checked = selected.includes(opt.k);
                  return `
                    <label class="flex items-start gap-2.5 p-2.5 rounded-lg border cursor-pointer transition text-sm ${
                      checked
                        ? 'bg-blue-50 dark:bg-blue-900/30 border-blue-400 dark:border-blue-600'
                        : 'border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/60'
                    }">
                      <input type="checkbox" value="${opt.k}" ${checked ? 'checked' : ''} ${locked ? 'disabled' : ''} onchange="toggleMulti2(${q1}, ${q2}, '${opt.k}', this)" class="mt-1 accent-blue-600 rounded">
                      <span><strong class="mr-1">${opt.k}</strong> ${opt.t}</span>
                    </label>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }

        return `
          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 sm:p-5 shadow-sm">
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white mb-1">${group.title}</h3>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mb-4">${group.instruction}</p>
            ${bodyHtml}

        `;
      }).join('');
      if (typeof renderRootHighlights === 'function') renderRootHighlights(HL_ROOTS[1]);   // dựng lại highlight của phần đề
    }

    function replaceInlineInputs(text) {
      const st = appState.tests[currentTestIdx];
      const isSubmitted = st.submitted;
      const locked = isLocked(currentPassageIdx);
      return text.replace(/\{\{(\d+)\}\}/g, (_, qNum) => {
        const q = parseInt(qNum, 10);
        const val = (st.answers[q] || '').replace(/"/g, '&quot;');
        let extraClass = '';
        let reviewHtml = '';
        if (isSubmitted) {
          const ok = isQuestionCorrect(currentTestIdx, q);
          extraClass = ok ? 'border-emerald-500 text-emerald-700 dark:text-emerald-400' : 'border-rose-500 text-rose-600 dark:text-rose-400 line-through';
          if (!ok) {
            const correctAns = TESTS[currentTestIdx].answers[q].join(' / ');
            reviewHtml = `<span class="ml-1 px-1.5 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/60 text-emerald-800 dark:text-emerald-200 text-xs font-bold">${correctAns}</span>`;
          }

        return `<span id="q-anchor-${q}" class="inline-flex items-center gap-1 mx-0.5">
          <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-blue-600 text-white text-[10px] font-extrabold shrink-0">${q}</span>
          <input type="text" value="${val}" ${locked ? 'disabled' : ''} oninput="setAnswer(${q}, this.value, false)" autocomplete="off" spellcheck="false"
            class="inline-input text-sm text-slate-900 dark:text-white ${extraClass}" placeholder="......" />
          ${reviewHtml}
        </span>`;
      });
    }

    function replaceInlineSelects(text, options) {

      const locked = isLocked(currentPassageIdx);
      return text.replace(/\{\{(\d+)\}\}/g, (_, qNum) => {

          if (!ok) {

    function getQuestionCardBorder(q) {

      return isQuestionCorrect(currentTestIdx, q)

        : 'border-rose-400 dark:border-rose-600 bg-rose-50/30 dark:bg-rose-950/20';

    /* =========================================================================
       9. CẬP NHẬT ĐÁP ÁN & ĐIỀU HƯỚNG FOOTER
       ========================================================================= */
    function setAnswer(q, val, shouldReRender = true) {
      const st = appState.tests[currentTestIdx];
      if (isLocked(currentPassageIdx)) return;
      st.answers[q] = val;
      saveState();
      updateHeaderActionButtons();
      renderFooterNav();
      if (shouldReRender) {
        renderQuestions(TESTS[currentTestIdx].passages[currentPassageIdx]);
      }
    }

    function toggleMulti2(q1, q2, letter, checkbox) {
      const st = appState.tests[currentTestIdx];
      if (isLocked(currentPassageIdx)) return;
      let current = [st.answers[q1], st.answers[q2]].filter(Boolean);
      if (checkbox.checked) {
        if (current.length >= 2) {
          checkbox.checked = false;
          showToast("Bạn chỉ được chọn tối đa 2 đáp án cho câu hỏi này.");
          return;
        }
        current.push(letter);
      } else {
        current = current.filter(x => x !== letter);
      }
      current.sort();
      st.answers[q1] = current[0] || '';
      st.answers[q2] = current[1] || '';
      saveState();
      updateHeaderActionButtons();
      renderFooterNav();
      renderQuestions(TESTS[currentTestIdx].passages[currentPassageIdx]);
    }

    function renderFooterNav() {
      const st = appState.tests[currentTestIdx];
      const tabsEl = document.getElementById('passageTabs');
      if (PIDX === null) {
        tabsEl.innerHTML = TEST.passages.map((p, idx) => {
          let c = 0;
          for (let q = p.qRange[0]; q <= p.qRange[1]; q++) if (hasAns(st.answers[q])) c++;
          const cls = idx === currentPassageIdx
            ? "px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm transition"
            : "px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition";
          return `<button onclick="switchPassage(${idx})" class="${cls}">Passage ${idx + 1} <span class="font-semibold opacity-75">${c}/${p.qRange[1] - p.qRange[0] + 1}</span></button>`;
        }).join('');
      } else {
        tabsEl.innerHTML = `<span class="px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm">Passage ${PIDX + 1} · làm lẻ</span>`;
      }

      // Chỉ hiện các ô số của passage đang làm (gọn, không tràn hàng)
      const [lo, hi] = TEST.passages[currentPassageIdx].qRange;
      let html = '';
      for (let q = lo; q <= hi; q++) {
        const answered = hasAns(st.answers[q]);
        let cls = 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700';
        if (st.submitted) {
          cls = isQuestionCorrect(currentTestIdx, q)
            ? 'bg-emerald-500 text-white border-emerald-600'
            : 'bg-rose-500 text-white border-rose-600';
        } else if (answered) {
          cls = 'bg-blue-600 text-white border-blue-600';
        }
        html += `<button onclick="jumpToQuestion(${q})" class="w-8 h-8 rounded-lg text-xs font-bold border shrink-0 flex items-center justify-center hover:scale-105 transition ${cls}">${q}</button>`;
      }

    function jumpToQuestion(q) {
      let targetPassage = TEST.passages.findIndex(p => q >= p.qRange[0] && q <= p.qRange[1]);
      if (targetPassage < 0) targetPassage = 0;
      if (targetPassage !== currentPassageIdx) {
        switchPassage(targetPassage);
      }
      // On mobile, switch to questions tab
      if (window.innerWidth < 768) {
        setMobilePane('questions');
      }
      setTimeout(() => {
        const el = document.getElementById('q-anchor-' + q);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.classList.add('ring-2', 'ring-blue-500', 'rounded-xl');
          setTimeout(() => el.classList.remove('ring-2', 'ring-blue-500'), 1200);
        }
      }, 60);
    }

    /* =========================================================================
       10. CHẤM ĐIỂM & MODALS
       ========================================================================= */
    function normalizeText(str) {
      // Khớp core/scoring.normalize: không phân biệt hoa/thường, gạch nối = khoảng trắng, bỏ dấu câu ở hai đầu
      return String(str === null || str === undefined ? '' : str).toLowerCase()
        .replace(/[\u2010-\u2015\u2212-]/g, ' ').replace(/\s+/g, ' ').trim()
        .replace(/^[\s.,;:!?"'\u201c\u201d\u2018\u2019]+|[\s.,;:!?"'\u201c\u201d\u2018\u2019]+$/g, '');
    }

    function isQuestionCorrect(testIdx, q) {
      const test = TESTS[testIdx];
      const st = appState.tests[testIdx];
      const userVal = normalizeText(st.answers[q]);
      if (!userVal) return false;

      // Special check for pair questions (e.g. Test 2 Q20 & Q21 in either order)
      if (test.pairQuestions) {
        for (const [q1, q2, validSet] of test.pairQuestions) {
          if (q === q1 || q === q2) {
            const u1 = normalizeText(st.answers[q1]);
            const u2 = normalizeText(st.answers[q2]);
            const validLower = validSet.map(v => normalizeText(v));
            if (q === q1) return validLower.includes(u1);
            if (q === q2) return validLower.includes(u2) && u2 !== u1;
          }
        }
      }

      const validAnswers = test.answers[q].map(a => normalizeText(a));
      return validAnswers.includes(userVal);
    }

            ${answered === 0 ? '<br><span class="text-rose-600 dark:text-rose-400 font-semibold">Chưa có câu nào được trả lời, lượt này sẽ không được tính vào thống kê.</span>' : ''}

    function computeResult(isTimeout) {
      const st = appState.tests[currentTestIdx];
      const byPassage = scopePassages().map(i => {
        const p = TEST.passages[i];
        let correct = 0;
        for (let q = p.qRange[0]; q <= p.qRange[1]; q++) if (isQuestionCorrect(currentTestIdx, q)) correct++;
        return { label: 'Passage ' + (i + 1), correct: correct, total: p.qRange[1] - p.qRange[0] + 1 };
      });
      const total = byPassage.reduce((s, p) => s + p.correct, 0);
      return {
        score: total,
        total: QTOTAL,
        band: PIDX === null ? getBandScore(total) : null,   // passage lẻ không quy band
        seconds: getSpent(st),
        timeout: !!isTimeout,
        scope: SCOPE,
        byPassage: byPassage
      };
    }

    /* =========================================================================
       11. CÔNG CỤ HIGHLIGHT VĂN BẢN TRÊN BÀI ĐỌC
       ========================================================================= */
    const passageContentEl = document.getElementById('passageContent');
    const questionsEl = document.getElementById('questionsContainer');
    const hlTooltip = document.getElementById('hlTooltip');
    const HL_COLORS = ['yellow', 'orange', 'red'];

    // Highlight được cả bài đọc lẫn phần đề (câu hỏi, hướng dẫn, bảng, ghi chú...).
    // Mỗi vùng có khóa riêng trong st.hl: "0", "1"... cho bài đọc; "q0", "q1"... cho phần đề của passage đó.
    const HL_ROOTS = [
      { el: passageContentEl, key: () => String(currentPassageIdx) },
      { el: questionsEl,      key: () => 'q' + currentPassageIdx },
    ];
    const HL_SKIP = 'select, option, textarea, button, script, style, input';

    // Highlight lưu dưới dạng vùng ký tự {s, e, c} trong văn bản của vùng, nên vẽ lại được sau khi đổi passage / làm mới đề / tải lại trang
    function hlStore(root) {
      const st = appState.tests[currentTestIdx];
      if (!st.hl) st.hl = {};
      const k = root.key();
      if (!st.hl[k]) st.hl[k] = [];
      return st.hl[k];
    }

    // Các nút chữ có thể highlight (bỏ qua ô chọn, nút bấm, ô nhập)
    function hlTextNodes(rootEl) {
      const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, {
        acceptNode: (n) => (n.parentElement && n.parentElement.closest(HL_SKIP))
          ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
      });
      const nodes = [];
      let n;
      while ((n = walker.nextNode())) nodes.push(n);
      return nodes;
    }

    function textOffset(rootEl, node, off) {
      const r = document.createRange();
      r.setStart(rootEl, 0);
      r.setEnd(node, off);
      let pos = 0;
      for (const t of hlTextNodes(rootEl)) {
        if (t === node) return pos + off;
        if (r.comparePoint(t, t.nodeValue.length) > 0) break;     // nút này nằm sau điểm chọn
        pos += t.nodeValue.length;
      }
      return pos;
    }

    function unwrapMarks(rootEl) {
      rootEl.querySelectorAll('mark.user-hl').forEach(m => {
        const parent = m.parentNode;
        while (m.firstChild) parent.insertBefore(m.firstChild, m);
        parent.removeChild(m);
      });
      rootEl.normalize();
    }

    function wrapRange(rootEl, s, e, color, index) {
      const nodes = hlTextNodes(rootEl);
      let pos = 0;
      for (const node of nodes) {
        const len = node.nodeValue.length;
        const a = Math.max(s, pos) - pos;
        const b = Math.min(e, pos + len) - pos;
        pos += len;
        if (b <= a) { if (pos >= e) break; continue; }
        if (!node.nodeValue.slice(a, b).trim()) continue;          // đoạn toàn khoảng trắng (giữa các thẻ) thì bỏ qua
        let target = node;
        if (a > 0) target = node.splitText(a);
        if (b - a < target.nodeValue.length) target.splitText(b - a);
        const mark = document.createElement('mark');
        mark.className = 'user-hl hl-' + color;
        mark.dataset.i = String(index);
        mark.title = 'Bấm để xóa highlight';
        target.parentNode.insertBefore(mark, target);
        mark.appendChild(target);
      }
    }

    function renderRootHighlights(root) {
      unwrapMarks(root.el);
      hlStore(root).forEach((h, i) => wrapRange(root.el, h.s, h.e, h.c, i));
    }

    function renderHighlights() { HL_ROOTS.forEach(renderRootHighlights); }

    function hideTip() { hlTooltip.style.display = 'none'; }

    function rootOf(node) { return HL_ROOTS.find(r => r.el.contains(node)) || null; }

    let pendingRoot = null;

    function updateTip(ev) {
      if (ev && ev.target && ev.target.closest && ev.target.closest('#hlTooltip')) return;
      setTimeout(() => {
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed || !sel.rangeCount) { hideTip(); return; }
        const range = sel.getRangeAt(0);
        const root = rootOf(range.commonAncestorContainer);
        if (root) {
          const rect = range.getBoundingClientRect();
          pendingSelectionRange = range.cloneRange();
          pendingRoot = root;
          hlTooltip.style.top = Math.max(10, rect.top - 46) + 'px';
          hlTooltip.style.left = Math.min(window.innerWidth - 110, Math.max(110, rect.left + rect.width / 2)) + 'px';
          hlTooltip.style.display = 'flex';
        } else {
          hideTip();
        }
      }, 10);
    }
    document.addEventListener('mouseup', updateTip);
    document.addEventListener('touchend', updateTip);
    document.addEventListener('keyup', (e) => { if (e.shiftKey) updateTip(e); });

    function applyHighlight(color) {
      if (!pendingSelectionRange || !pendingRoot) return;
      if (!HL_COLORS.includes(color)) color = 'yellow';
      const r = pendingSelectionRange, root = pendingRoot;
      pendingSelectionRange = null; pendingRoot = null;
      hideTip();
      if (!root.el.contains(r.commonAncestorContainer)) return;
      let s = textOffset(root.el, r.startContainer, r.startOffset);
      let e = textOffset(root.el, r.endContainer, r.endOffset);
      if (e < s) { const t = s; s = e; e = t; }
      if (e <= s) return;
      // Phần chồng lên highlight cũ thì cắt bỏ phần đó, highlight mới đè lên
      const out = [];
      hlStore(root).forEach(h => {
        if (h.e <= s || h.s >= e) { out.push(h); return; }
        if (h.s < s) out.push({ s: h.s, e: s, c: h.c });
        if (h.e > e) out.push({ s: e, e: h.e, c: h.c });
      });
      out.push({ s: s, e: e, c: color });
      out.sort((x, y) => x.s - y.s);
      appState.tests[currentTestIdx].hl[root.key()] = out;
      window.getSelection().removeAllRanges();
      renderRootHighlights(root);
      saveState();
    }

    // Bấm vào chữ đã highlight để xóa. Dùng capture để không kích hoạt nhầm đáp án khi chữ nằm trong nhãn chọn.
    HL_ROOTS.forEach(root => {
      root.el.addEventListener('click', (ev) => {
        const sel = window.getSelection();
        const selecting = sel && !sel.isCollapsed;
        const m = ev.target.closest && ev.target.closest('mark.user-hl');
        if (selecting) {
          // vừa bôi đen xong trong nhãn đáp án: đừng để nhãn tự chọn đáp án
          if (ev.target.closest && ev.target.closest('label')) ev.preventDefault();
          return;
        }
        if (!m) return;
        const list = hlStore(root);
        const i = parseInt(m.dataset.i, 10);
        if (!(i >= 0 && i < list.length)) return;
        ev.preventDefault();
        ev.stopPropagation();
        list.splice(i, 1);
        renderRootHighlights(root);
        saveState();
      }, true);
    });

    function clearHighlights() {
      HL_ROOTS.forEach(root => { appState.tests[currentTestIdx].hl[root.key()] = []; });
      renderHighlights();
      saveState();
    }

    /* =========================================================================
       11b. THANH KÉO CHIA KHUNG BÀI ĐỌC / CÂU HỎI
       ========================================================================= */
    function applySplit() {
      const v = Math.min(70, Math.max(25, Number(appState.split) || 42));
      document.documentElement.style.setProperty('--split', v + '%');
    }
    (function initSplitter() {
      const sp = document.getElementById('splitter');
      if (!sp) return;
      let drag = false;
      sp.addEventListener('pointerdown', (e) => { drag = true; sp.setPointerCapture(e.pointerId); document.body.style.userSelect = 'none'; });
      sp.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const box = sp.parentElement.getBoundingClientRect();
        const pct = ((e.clientX - box.left) / box.width) * 100;
        appState.split = Math.round(Math.min(70, Math.max(25, pct)) * 10) / 10;
        applySplit();
      });
      const end = () => { if (!drag) return; drag = false; document.body.style.userSelect = ''; saveState(); };
      sp.addEventListener('pointerup', end);
      sp.addEventListener('pointercancel', end);
      sp.addEventListener('dblclick', () => { appState.split = 42; applySplit(); saveState(); });
    })();

    /* =========================================================================
       12. KHỞI CHẠY ỨNG DỤNG
       ========================================================================= */
    function onRender(args) {
      if (args.height) setFrameHeight(args.height);
      if (!args.test) return;
      NAV = Object.assign({ prev: false, next: false }, args.nav || {});
      applyNav();
      const key = args.sessionKey || args.test.id;
      if (key === SESSION_KEY) return;          // Streamlit rerun: giữ nguyên trạng thái đang làm
      SESSION_KEY = key;

      TEST = args.test;
      TESTS = [TEST];
      setScope(args.scope);
      const saved = args.saved || {};
      const prefs = args.prefs || {};
      const meta = args.meta || {};

      // Chưa từng chọn sáng/tối thì theo giao diện của Streamlit
      appState.darkMode = typeof prefs.darkMode === 'boolean' ? prefs.darkMode : args.theme === 'dark';
      appState.fontSize = prefs.fontSize || 15;
      appState.split = typeof prefs.split === 'number' ? prefs.split : 42;
      appState.tests[0] = loadSaved(saved);

      document.getElementById('logoBadge').textContent = meta.badge || 'O';
      document.getElementById('hdrTitle').textContent = meta.seriesTitle || 'Orange';
      document.getElementById('hdrSub').textContent = TEST.subtitle || 'Reading';
      dirty = false;
      applyTheme();
      openTest(0);
    }

    window.addEventListener('message', function (ev) {
      const d = ev.data;
      if (d && d.type === 'streamlit:render') onRender(d.args || {});
    });
    sendMsg('streamlit:componentReady', { apiVersion: 1 });
    setFrameHeight(820);
  </script>
</body>
</html>
