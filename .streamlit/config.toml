[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
font = "sans serif"

[client]
# Ẩn Share / Star / Edit / GitHub và menu mặc định với người dùng thường
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[server]
enableXsrfProtection = true
