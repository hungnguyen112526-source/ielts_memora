# Bảng màu xanh của IELTS Memora, có cả giao diện sáng và tối.
# Người dùng đổi sáng/tối ở menu ⋮ (góc trên phải) → Settings → Theme.
[theme]
primaryColor = "#2563eb"
font = "sans serif"
baseRadius = "large"

[theme.light]
primaryColor = "#2563eb"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"

[theme.dark]
primaryColor = "#3b82f6"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#111a2e"
textColor = "#e2e8f0"

[client]
toolbarMode = "auto"

[browser]
gatherUsageStats = false

[server]
enableXsrfProtection = true
